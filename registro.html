<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygq156OhoO-UYAzpt8jJKfBopB5GsxLzXiO_eVR_aBFaQTlKCFrpl1jy8nSuFaUfowdg/exec";

    document.getElementById('postulacionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "GENERANDO CONSTANCIA...";
      btn.disabled = true;

      // Generación de un folio aleatorio único
      const numAleatorio = Math.floor(1000 + Math.random() * 9000);
      const folio = `LCDF-2026-${numAleatorio}`;

      const payload = {
        action: "registro",
        roblox: document.getElementById('roblox').value.trim(),
        discord: document.getElementById('discord').value.trim(),
        edad: document.getElementById('edad').value.trim(),
        pais: document.getElementById('pais').value.trim(),
        motivo: document.getElementById('motivo').value.trim(),
        folio: folio
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        if (result.success) {
          document.getElementById('postulacionForm').classList.add('hidden');
          document.getElementById('folioGenerado').innerText = folio;
          
          // Si el servidor devolvió la URL del PDF, agregamos el botón de descarga
          if (result.pdfUrl) {
            const contenedor = document.getElementById('exitoRegistro');
            if (!document.getElementById('btnDescargarPdf')) {
              const btnPdf = document.createElement('a');
              btnPdf.id = 'btnDescargarPdf';
              btnPdf.href = result.pdfUrl;
              btnPdf.target = "_blank";
              btnPdf.className = "btn-secondary";
              btnPdf.style.background = "linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%)";
              btnPdf.style.color = "#ffffff";
              btnPdf.style.borderColor = "transparent";
              btnPdf.style.marginTop = "14px";
              btnPdf.innerText = "📄 DESCARGAR MI CONSTANCIA (PDF)";
              contenedor.insertBefore(btnPdf, contenedor.children[4]);
            }
          }

          document.getElementById('exitoRegistro').classList.remove('hidden');
        } else {
          throw new Error(result.error || "Error desconocido en el servidor");
        }

      } catch (err) {
        console.error(err);
        alert("Error al conectar con el servidor. Intenta nuevamente.");
        btn.innerText = "Enviar Postulación";
        btn.disabled = false;
      }
    });
  </script>
