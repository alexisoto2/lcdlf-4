<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyzo1clYek057TW8mjUc1psZRnqOqRmjgAYDpi5ADFv8P-rFiethF_MmoRrxkoReMacrA/exec";


const form =
  document.getElementById("postulacionForm");

const btnSubmit =
  document.getElementById("btnSubmit");

const mensaje =
  document.getElementById("mensaje");

const formContainer =
  document.getElementById("formContainer");

const exitoRegistro =
  document.getElementById("exitoRegistro");

const folioGenerado =
  document.getElementById("folioGenerado");

const btnNuevo =
  document.getElementById("btnNuevo");

const motivo =
  document.getElementById("motivo");

const contador =
  document.getElementById("contador");


/* ==========================================
   CONTADOR
========================================== */

motivo.addEventListener(
  "input",
  function () {

    contador.textContent =
      `${motivo.value.length} / 500`;

  }
);


/* ==========================================
   MENSAJE DE ERROR
========================================== */

function mostrarError(texto) {

  mensaje.textContent =
    texto;

  mensaje.className =
    "mensaje error";

}


function limpiarMensaje() {

  mensaje.textContent =
    "";

  mensaje.className =
    "mensaje";

}


/* ==========================================
   VALIDAR FORMULARIO
========================================== */

function validarFormulario() {

  const roblox =
    document
      .getElementById("roblox")
      .value
      .trim();

  const discord =
    document
      .getElementById("discord")
      .value
      .trim();

  const edad =
    Number(
      document
        .getElementById("edad")
        .value
    );

  const pais =
    document
      .getElementById("pais")
      .value
      .trim();

  const textoMotivo =
    motivo.value.trim();


  if (!roblox) {

    mostrarError(
      "Escribe tu usuario de Roblox."
    );

    return false;

  }


  if (!discord) {

    mostrarError(
      "Escribe tu usuario de Discord."
    );

    return false;

  }


  if (
    !edad ||
    edad < 13 ||
    edad > 99
  ) {

    mostrarError(
      "La edad debe estar entre 13 y 99 años."
    );

    return false;

  }


  if (!pais) {

    mostrarError(
      "Escribe tu país."
    );

    return false;

  }


  if (
    textoMotivo.length < 15
  ) {

    mostrarError(
      "Escribe al menos 15 caracteres explicando por qué deberías entrar."
    );

    return false;

  }


  return true;

}


/* ==========================================
   ENVIAR POSTULACIÓN
========================================== */

form.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();

    limpiarMensaje();


    if (
      !validarFormulario()
    ) {

      return;

    }


    btnSubmit.disabled =
      true;

    btnSubmit.textContent =
      "ENVIANDO POSTULACIÓN...";


    /*
     * IMPORTANTE:
     *
     * YA NO GENERAMOS EL FOLIO AQUÍ.
     *
     * Google Apps Script lo genera.
     */


    const payload = {

      action:
        "registro",

      roblox:
        document
          .getElementById("roblox")
          .value
          .trim(),

      discord:
        document
          .getElementById("discord")
          .value
          .trim(),

      edad:
        document
          .getElementById("edad")
          .value,

      pais:
        document
          .getElementById("pais")
          .value
          .trim(),

      motivo:
        motivo.value
          .trim()

    };


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const result =
        await response.json();


      console.log(
        "Respuesta Apps Script:",
        result
      );


      if (
        !result.success
      ) {

        throw new Error(
          result.mensaje ||
          "No se pudo registrar la postulación."
        );

      }


      /*
       * FOLIO GENERADO POR APPS SCRIPT
       */

      const folio =
        result.folio;


      if (!folio) {

        throw new Error(
          "Apps Script no devolvió un folio."
        );

      }


      /*
       * Guardarlo localmente
       */

      localStorage.setItem(
        "ultimoFolioLCDF",
        folio
      );


      /*
       * Mostrar folio
       */

      folioGenerado.textContent =
        folio;


      /*
       * Cambiar pantalla
       */

      formContainer
        .classList
        .add("hidden");


      exitoRegistro
        .classList
        .remove("hidden");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


    }

    catch (error) {

      console.error(
        "Error:",
        error
      );


      mostrarError(
        error.message ||
        "No se pudo enviar la postulación. Intenta nuevamente."
      );


      btnSubmit.disabled =
        false;

      btnSubmit.textContent =
        "ENVIAR POSTULACIÓN";

    }

  }
);


/* ==========================================
   NUEVA POSTULACIÓN
========================================== */

btnNuevo.addEventListener(
  "click",
  function () {

    form.reset();

    limpiarMensaje();

    contador.textContent =
      "0 / 500";


    exitoRegistro
      .classList
      .add("hidden");


    formContainer
      .classList
      .remove("hidden");


    btnSubmit.disabled =
      false;

    btnSubmit.textContent =
      "ENVIAR POSTULACIÓN";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);

</script>
