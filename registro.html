<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa de los Famosos Roblox - Registro</title>
  <style>
    /* ... (Mantén los estilos iguales que antes) ... */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: radial-gradient(circle at 20% 20%, #e0c3fc 0%, #8ec5fc 40%, #fbc2eb 70%, #a1c4fd 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 24px; max-width: 480px; width: 100%; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; text-transform: uppercase; }
    .folio-result-box { background: #f8fafc; border: 2px dashed #2563eb; border-radius: 16px; padding: 20px; text-align: center; margin: 20px 0; }
    .folio-code { font-size: 32px; font-weight: 900; color: #1e40af; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="formContainer">
      <h2 style="text-align: center; margin-bottom: 20px; color: #1e40af;">Registro de Postulación</h2>
      <form id="postulacionForm">
        <input type="text" id="roblox" required placeholder="Usuario de Roblox" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
        <input type="text" id="discord" required placeholder="Usuario de Discord" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
        <input type="number" id="edad" required placeholder="Edad" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
        <input type="text" id="pais" required placeholder="País" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
        <textarea id="motivo" required placeholder="¿Por qué deberías entrar?" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;"></textarea>
        <button type="submit" class="btn-primary" id="btnSubmit">Enviar Postulación</button>
      </form>
    </div>

    <!-- Pantalla de Éxito Simplificada -->
    <div id="exitoRegistro" class="hidden">
      <h3 style="text-align: center; color: #1e40af;">¡Postulación Enviada!</h3>
      <div class="folio-result-box">
        <p style="font-size: 12px; color: #64748b;">TU CÓDIGO DE SEGUIMIENTO:</p>
        <div class="folio-code" id="folioGenerado">LCDF-0000</div>
      </div>
      <p style="text-align: center; font-size: 13px;">Guarda este código para consultar tu estado en la sección de <strong>Consulta</strong>.</p>
      <a href="consulta.html" style="display:block; text-align:center; margin-top:20px; color:#2563eb;">Ir a consultar estado</a>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySGTYGtGeRK7GN4SJJbGLPco_8XxuOxhrnRKzeNWYBXG07TIWtqnsTRHPrqBy-LzXg1Q/exec";

    document.getElementById('postulacionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "ENVIANDO...";
      btn.disabled = true;

      const folio = `LCDF-${Math.floor(1000 + Math.random() * 9000)}`;
      const payload = {
        action: "registro",
        roblox: document.getElementById('roblox').value,
        discord: document.getElementById('discord').value,
        edad: document.getElementById('edad').value,
        pais: document.getElementById('pais').value,
        motivo: document.getElementById('motivo').value,
        folio: folio
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('folioGenerado').innerText = folio;
        document.getElementById('exitoRegistro').classList.remove('hidden');
      } catch (err) {
        alert("Error al enviar. Intenta de nuevo.");
        btn.innerText = "Enviar Postulación";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
