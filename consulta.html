<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa de los Famosos Roblox - Consulta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #e0c3fc 0%, #8ec5fc 40%, #fbc2eb 70%, #a1c4fd 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15), 0 10px 25px rgba(147, 51, 234, 0.1);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3));
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .nav-link {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .nav-link.active {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .nav-link.inactive {
      background: rgba(255, 255, 255, 0.6);
      color: #475569;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .nav-link.inactive:hover {
      background: rgba(255, 255, 255, 0.9);
      color: #1e40af;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      color: #0f172a;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 8px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .resultado-box {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #2563eb;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .estado-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .estado-aceptado { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .estado-rechazado { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .estado-pendiente { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }

    .btn-secondary {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: #ffffff;
      color: #1e40af;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      text-decoration: none;
      margin-top: 16px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #f0f9ff;
      border-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <a href="index.html">
        <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
      </a>
    </div>

    <!-- Menú Superior de Navegación -->
    <div class="nav-buttons">
      <a href="index.html" class="nav-link inactive">🏠 Inicio</a>
      <a href="registro.html" class="nav-link inactive">📝 Registro</a>
      <a href="consulta.html" class="nav-link active">🔍 Consulta</a>
    </div>

    <!-- Formulario de Consulta -->
    <form id="consultaForm">
      <div class="form-group">
        <label for="folioInput">Ingresa tu Folio Único *</label>
        <input type="text" id="folioInput" required placeholder="Ej: LCDF-2026-1234">
      </div>

      <button type="submit" class="btn-primary" id="btnConsultar">Consultar Estado</button>
    </form>

    <!-- Resultado de la Consulta -->
    <div id="resultadoConsulta" class="resultado-box hidden">
      <h3 style="color: #1e40af; font-size: 18px; margin-bottom: 6px;">Resultado de Postulación</h3>
      <p id="infoRoblox" style="font-size: 14px; color: #475569; font-weight: 600;"></p>
      <div id="badgeEstado" class="estado-badge">PENDIENTE</div>
    </div>

    <a href="index.html" class="btn-secondary" style="border: none; background: transparent; color: #64748b;">Volver al Menú Principal</a>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySGTYGtGeRK7GN4SJJbGLPco_8XxuOxhrnRKzeNWYBXG07TIWtqnsTRHPrqBy-LzXg1Q/exec";

    document.getElementById('consultaForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnConsultar');
      const folio = document.getElementById('folioInput').value.trim();
      
      btn.innerText = "BUSCANDO...";
      btn.disabled = true;

      const payload = {
        action: "consulta",
        folio: folio
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        const resultadoDiv = document.getElementById('resultadoConsulta');
        const badge = document.getElementById('badgeEstado');
        const info = document.getElementById('infoRoblox');

        if (result.success) {
          info.innerText = `Roblox: ${result.roblox}`;
          
          badge.className = "estado-badge";
          const estado = (result.estado || "Pendiente").toLowerCase();

          if (estado.includes("aceptado")) {
            badge.classList.add("estado-aceptado");
            badge.innerText = "¡ACEPTADO!";
          } else if (estado.includes("rechazado")) {
            badge.classList.add("estado-rechazado");
            badge.innerText = "NO SELECCIONADO";
          } else {
            badge.classList.add("estado-pendiente");
            badge.innerText = "EN REVISIÓN / PENDIENTE";
          }

          resultadoDiv.classList.remove('hidden');
        } else {
          alert(result.error || "No se encontró ningún registro con ese folio.");
          resultadoDiv.classList.add('hidden');
        }

      } catch (err) {
        console.error(err);
        alert("Error al conectar con el servidor. Intenta nuevamente.");
      } finally {
        btn.innerText = "Consultar Estado";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
