<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa de los Famosos Roblox - Consulta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #e0c3fc 0%, #8ec5fc 40%, #fbc2eb 70%, #a1c4fd 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15), 0 10px 25px rgba(147, 51, 234, 0.1);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3));
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .nav-link {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .nav-link.active {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .nav-link.inactive {
      background: rgba(255, 255, 255, 0.6);
      color: #475569;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .nav-link.inactive:hover {
      background: rgba(255, 255, 255, 0.9);
      color: #1e40af;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 8px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none;
    }

    .result-box {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #cbd5e1;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }

    .result-value {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Estilos de Estado */
    .status-pendiente {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .status-aceptado {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-rechazado {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .btn-secondary {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: #ffffff;
      color: #1e40af;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      text-decoration: none;
      margin-top: 16px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #f0f9ff;
      border-color: #2563eb;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px;
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <a href="index.html">
        <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
      </a>
    </div>

    <!-- Menú Superior de Navegación -->
    <div class="nav-buttons">
      <a href="index.html" class="nav-link inactive">🏠 Inicio</a>
      <a href="registro.html" class="nav-link inactive">📝 Registro</a>
      <a href="consulta.html" class="nav-link active">🔍 Consulta</a>
    </div>

    <!-- Formulario de Consulta -->
    <form id="consultaForm">
      <div class="form-group">
        <label for="folioInput">Ingresa tu Folio *</label>
        <input type="text" id="folioInput" required placeholder="Ej: LCDF-2026-1234">
      </div>

      <button type="submit" class="btn-primary" id="btnBuscar">Buscar Estado</button>
    </form>

    <!-- Caja de Mensaje de Error (Si no encuentra el folio) -->
    <div id="errorBox" class="error-box hidden">
      ❌ Folio no encontrado. Revisa que lo hayas escrito correctamente.
    </div>

    <!-- Resultado de la Consulta -->
    <div id="resultadoConsulta" class="result-box hidden">
      <div class="result-item">
        <span class="result-label">Folio:</span>
        <span class="result-value" id="resFolio">LCDF-0000</span>
      </div>

      <div class="result-item">
        <span class="result-label">Roblox:</span>
        <span class="result-value" id="resRoblox">--</span>
      </div>

      <div class="result-item">
        <span class="result-label">Discord:</span>
        <span class="result-value" id="resDiscord">--</span>
      </div>

      <div class="result-item">
        <span class="result-label">Estado:</span>
        <span id="resEstatus" class="status-badge status-pendiente">Pendiente</span>
      </div>

      <a href="consulta.html" class="btn-secondary" onclick="location.reload();">Consultar otro folio</a>
    </div>
  </div>

  <script>
    // Reemplaza esta URL con la URL de tu Web App desplegada en Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID_AQUI/exec";

    document.getElementById('consultaForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const folioQuery = document.getElementById('folioInput').value.trim().toUpperCase();
      const btn = document.getElementById('btnBuscar');
      const errorBox = document.getElementById('errorBox');
      const resultadoBox = document.getElementById('resultadoConsulta');

      btn.innerText = "BUSCANDO...";
      btn.disabled = true;
      errorBox.classList.add('hidden');
      resultadoBox.classList.add('hidden');

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=consulta&folio=${encodeURIComponent(folioQuery)}`);
        const data = await response.json();

        if (data.success && data.encontrado) {
          document.getElementById('resFolio').innerText = data.data.folio;
          document.getElementById('resRoblox').innerText = data.data.roblox;
          document.getElementById('resDiscord').innerText = data.data.discord;

          const badgeEstatus = document.getElementById('resEstatus');
          const estado = (data.data.estatus || 'PENDIENTE').toUpperCase();
          badgeEstatus.innerText = estado;

          // Asignar clase de color según el estado
          badgeEstatus.className = "status-badge";
          if (estado.includes("ACEPTAD")) {
            badgeEstatus.classList.add("status-aceptado");
          } else if (estado.includes("RECHAZAD")) {
            badgeEstatus.classList.add("status-rechazado");
          } else {
            badgeEstatus.classList.add("status-pendiente");
          }

          resultadoBox.classList.remove('hidden');
        } else {
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        alert("Error al conectar con el servidor de búsqueda.");
      } finally {
        btn.innerText = "Buscar Estado";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
