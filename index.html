<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa de los Famosos Roblox - Inicio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #e0c3fc 0%, #8ec5fc 40%, #fbc2eb 70%, #a1c4fd 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15), 0 10px 25px rgba(147, 51, 234, 0.1);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-img {
      width: 100%;
      max-width: 280px;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3));
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: #1e40af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #475569;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-option {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .btn-registro {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-registro:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
    }

    .btn-consulta {
      background: rgba(255, 255, 255, 0.85);
      color: #1e40af;
      border: 2px solid #93c5fd;
    }

    .btn-consulta:hover {
      background: #ffffff;
      border-color: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo.png" alt="La Casa de los Famosos Roblox" class="logo-img">
    </div>

    <h1 class="title">Portal Oficial</h1>
    <p class="subtitle">Selecciona una opción para continuar con tu postulación o consultar tus resultados.</p>

    <div class="menu-options">
      <a href="registro.html" class="btn-option btn-registro">
        📝 Registrar Postulación
      </a>
      
      <a href="consulta.html" class="btn-option btn-consulta">
        🔍 Consultar Folio
      </a>
    </div>

    <div class="footer-note">
      La Casa de los Famosos Roblox &copy; 2026
    </div>
  </div>

</body>
</html>
